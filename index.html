<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP4 Video Example</title>
</head>
<body>

   
    <!-- Video element -->
    <video width="3000000000000000000000000000" height="30000000000000000000" controls autoplay muted loop>
        <!-- MP4 source -->
        <source src="scream7.mp4" type="video/mp4">
        <!-- Optional: other formats for browser compatibility -->
        <source src="video.webm" type="video/webm">
        <source src="video.ogg" type="video/ogg">
        
        <!-- Fallback text for unsupported browsers -->
        Your browser does not support the video tag.
    </video>

</body>
</html>
